[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whoop-mcp"
version = "0.1.0"
description = "FastMCP server for accessing the WHOOP API and exposing health data to MCP clients."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.4",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[project.scripts]
whoop-mcp = "whoop_mcp.server:main"
whoop-mcp-login = "whoop_mcp.login:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whoop_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
    "/.env.example",
    "/.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
