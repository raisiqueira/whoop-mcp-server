services:
  whoop-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: whoop-mcp:latest
    container_name: whoop-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WHOOP_MCP_TRANSPORT: http
      WHOOP_MCP_HOST: 0.0.0.0
      WHOOP_MCP_PORT: 8000
      WHOOP_MCP_PATH: /mcp
      WHOOP_MCP_STATELESS_HTTP: "true"
      FASTMCP_HOME: /data/fastmcp
      WHOOP_TOKEN_FILE: /data/whoop-token.json
      WHOOP_MCP_AUTH_MODE: ${WHOOP_MCP_AUTH_MODE:-static_token}
      WHOOP_MCP_BASE_URL: ${WHOOP_MCP_BASE_URL:-}
      WHOOP_MCP_API_KEY: ${WHOOP_MCP_API_KEY:-}
      WHOOP_MCP_OIDC_CONFIG_URL: ${WHOOP_MCP_OIDC_CONFIG_URL:-}
      WHOOP_MCP_OIDC_CLIENT_ID: ${WHOOP_MCP_OIDC_CLIENT_ID:-}
      WHOOP_MCP_OIDC_CLIENT_SECRET: ${WHOOP_MCP_OIDC_CLIENT_SECRET:-}
      WHOOP_MCP_OIDC_SCOPES: ${WHOOP_MCP_OIDC_SCOPES:-openid profile email}
      WHOOP_MCP_OIDC_REDIRECT_PATH: ${WHOOP_MCP_OIDC_REDIRECT_PATH:-/auth/callback}
      WHOOP_MCP_OIDC_ALLOWED_CLIENT_REDIRECT_URIS: ${WHOOP_MCP_OIDC_ALLOWED_CLIENT_REDIRECT_URIS:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.whoop-token.json:/data/whoop-token.json
      - fastmcp-oauth-data:/data/fastmcp

volumes:
  fastmcp-oauth-data:
